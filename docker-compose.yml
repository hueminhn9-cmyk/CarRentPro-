version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: autorent-mysql
    restart: always
    environment:
      MYSQL_DATABASE: autorent_db
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - autorent-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autorent-api
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:@db:3306/autorent_db
      - JWT_SECRET=autorent_jwt_access_secret_key_2026_super_secure
      - JWT_REFRESH_SECRET=autorent_jwt_refresh_secret_key_2026_super_secure_refresh
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    networks:
      - autorent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autorent-web
    restart: always
    ports:
      - '80:80'
      - '5173:80'
    depends_on:
      - backend
    networks:
      - autorent-network

volumes:
  mysql-data:

networks:
  autorent-network:
    driver: bridge
